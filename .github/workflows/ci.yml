name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Check default build
        run: cargo check --locked
      - name: Check installer syntax
        run: sh -n install.sh

  aarch64-musl:
    name: Build AArch64 musl daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release binaries
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE":/home/rust/src
          -w /home/rust/src
          messense/rust-musl-cross:aarch64-musl
          cargo build --release --locked --bin yamd
      - uses: actions/upload-artifact@v4
        with:
          name: yamd-aarch64-linux-musl
          if-no-files-found: error
          path: |
            target/aarch64-unknown-linux-musl/release/yamd

  linux-cli:
    name: Build Linux CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 musl CLI
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE":/home/rust/src
          -w /home/rust/src
          messense/rust-musl-cross:x86_64-musl
          cargo build --release --locked --bin yam
      - uses: actions/upload-artifact@v4
        with:
          name: yam-x86_64-unknown-linux-musl
          if-no-files-found: error
          path: target/x86_64-unknown-linux-musl/release/yam

  windows:
    name: Build Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin yam
      - uses: actions/upload-artifact@v4
        with:
          name: yam-x86_64-pc-windows-msvc
          if-no-files-found: error
          path: |
            target/release/yam.exe

  macos-arm64:
    name: Build macOS arm64 CLI
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin yam
      - uses: actions/upload-artifact@v4
        with:
          name: yam-aarch64-apple-darwin
          if-no-files-found: error
          path: target/release/yam
