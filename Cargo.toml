[package]
name = "yam"
version = "0.2.5"
edition = "2021"

[[bin]]
name = "yam"
path = "src/bin/yam.rs"

[[bin]]
name = "yam-sign-update"
path = "src/bin/yam_sign_update.rs"

[[bin]]
name = "yam-publish"
path = "src/bin/yam_publish.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tar = "0.4"
zstd = "0.13"
semver = "1"
fs4 = { version = "0.9", features = ["sync"] }
wait-timeout = "0.2"

[profile.release]
# The manager is deployed to storage-constrained speakers.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
