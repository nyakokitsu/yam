<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YAM</title>
  <style>
    body { max-width: 900px; margin: 3rem auto; font: 16px system-ui; background: #10131a; color: #e8edf7; }
    button, input, select { padding: .55rem; margin: .2rem; }
    section { padding: 1rem; margin: 1rem 0; background: #1b2230; border-radius: 8px; }
    .plugin { display: flex; gap: .5rem; align-items: center; border-top: 1px solid #344; padding: .6rem 0; }
    .plugin span { flex: 1; }
    small { color: #aab; }
  </style>
</head>
<body>
  <h1>YAM</h1>
  <p id="device"></p>
  <section>
    <h2>Пакеты</h2>
    <form id="upload"><input type="file" name="package" accept=".yap" required><button>Установить .yap</button></form>
    <div id="plugins"></div>
  </section>
  <section>
    <h2>LED</h2>
    <input id="colors" value="#4285F4,#EA4335,#FBBC05" size="40">
    <button onclick="setLed()">Показать</button>
    <button onclick="turnOff()">Выключить</button>
  </section>
  <section>
    <h2>Настройки</h2>
    <label>Профиль <select id="profile" onchange="syncCount()"><option>mini2</option><option>micro</option><option>midi</option><option>plum</option><option>sysfs-ring</option><option>custom</option></select></label>
    <label>LED count <input id="count" type="number" min="1" max="128"></label>
    <label><input id="binaries" type="checkbox"> Разрешить бинарники плагинов</label>
    <button onclick="saveSettings()">Сохранить</button>
  </section>
<script>
const api = '/api';
async function request(path, options) {
  const response = await fetch(api + path, options);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || response.statusText);
  return response;
}
function pluginRow(plugin) {
  const { manifest, enabled, running, compatible, incompatibility } = plugin;
  const run = compatible ? (running ? 'Перезапустить' : 'Запустить') : 'Несовместим';
  const disabled = compatible ? '' : `disabled title="${incompatibility}"`;
  const stop = running ? `<button onclick="action('${manifest.id}', 'stop')">Остановить</button>` : '';
  return `<div class="plugin"><span><b>${manifest.name}</b> <small>${manifest.id} · ${manifest.version}<br>${manifest.description || ''}</small></span><button onclick="action('${manifest.id}', 'toggle')">${enabled ? 'Выключить' : 'Включить'}</button><button ${disabled} onclick="action('${manifest.id}', 'invoke')">${run}</button>${stop}<button onclick="action('${manifest.id}', 'delete')">Удалить</button></div>`;
}
async function load() {
  try {
    const [pluginData, settings, currentDevice] = await Promise.all([request('/plugins').then(r => r.json()), request('/settings').then(r => r.json()), request('/device').then(r => r.json())]);
    device.textContent = `Колонка: ${currentDevice.model} · ${currentDevice.architecture} · ${currentDevice.features.join(', ')}`;
    plugins.innerHTML = pluginData.map(pluginRow).join('') || 'Пакетов нет';
    profile.value = settings.led.profile;
    count.value = settings.led.count;
    binaries.checked = settings.allow_plugin_binaries;
  } catch (error) { alert(error.message); }
}
async function action(id, name) {
  try { await request(`/plugins/${id}${name === 'delete' ? '' : `/${name}`}`, { method: name === 'delete' ? 'DELETE' : 'POST' }); await load(); } catch (error) { alert(error.message); }
}
upload.onsubmit = async event => {
  event.preventDefault();
  try { await request('/plugins', { method: 'POST', body: new FormData(upload) }); await load(); } catch (error) { alert(error.message); }
};
function ringColors() { const list = colors.value.split(',').map(c => c.trim()).filter(Boolean); return list.length ? Array.from({ length: Number(count.value) || list.length }, (_, i) => list[i % list.length]) : list; }
async function setLed() { try { await request('/led', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ colors: ringColors() }) }); } catch (error) { alert(error.message); } }
async function turnOff() { try { await request('/led/off', { method: 'POST' }); } catch (error) { alert(error.message); } }
const ZONE_COUNTS = { mini2: 6, micro: 3, midi: 24, plum: 3 };
function syncCount() {
  const zones = ZONE_COUNTS[profile.value];
  if (zones) count.value = zones;
}
async function saveSettings() {
  try { syncCount(); const settings = await request('/settings').then(r => r.json()); settings.led.profile = profile.value; settings.led.count = Number(count.value); settings.allow_plugin_binaries = binaries.checked; await request('/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(settings) }); } catch (error) { alert(error.message); }
}
load();
</script>
</body>
</html>
